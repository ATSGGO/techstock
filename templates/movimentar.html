<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>TechStock Manager - Movimentação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">🔄 Registo de Movimentação (Entrada / Saída)</h3>
                
                <form action="/movimentar" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Selecionar Ativo / Produto:</label>
                        <select class="form-select" name="produto_id" required>
                            {% for p in produtos %}
                                <option value="{{ p.id }}">{{ p.sku }} - {{ p.nome_comercial }} (Estoque Atual: {{ p.volume_estoque }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Tipo de Operação:</label>
                        <select class="form-select" name="tipo_operacao" required>
                            <option value="Entrada">Entrada de Suprimento (Creditar)</option>
                            <option value="Saída">Saída por Venda / Aplicação (Debitar)</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Quantidade:</label>
                        <input type="number" min="1" class="form-control" name="quantidade" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Justificativa / Observação:</label>
                        <textarea class="form-control" name="justificativa" rows="3" required placeholder="Ex: Venda corporativa contrato X ou Reposição de armazém."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-warning">Efetivar Movimentação</button>
                    <a href="/" class="btn btn-secondary">Voltar ao Dashboard</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
