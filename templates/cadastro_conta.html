<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | TechStore Informática</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: #f2f5f9; }
        .signup-card { width: min(100% - 2rem, 500px); border: 0; border-radius: 1rem; }
    </style>
</head>
<body>
    <main class="card signup-card shadow">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="text-primary fw-bold">TECHSTORE INFORMÁTICA</div>
                <h1 class="h3 mt-2">Criar conta de operador</h1>
                <p class="text-secondary">Use seu e-mail para entrar no TechStock.</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="post" action="{{ url_for('cadastrar_conta') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="nome_completo">Nome completo</label>
                    <input class="form-control" id="nome_completo" name="nome_completo"
                           value="{{ request.form.get('nome_completo', '') }}"
                           autocomplete="name" minlength="2" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Seu e-mail</label>
                    <input class="form-control" id="email" name="email" type="email"
                           value="{{ request.form.get('email', '') }}"
                           autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="senha">Senha</label>
                    <input class="form-control" id="senha" name="senha" type="password"
                           autocomplete="new-password" minlength="8" required>
                    <div class="form-text">Use pelo menos 8 caracteres.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirmar_senha">Confirme a senha</label>
                    <input class="form-control" id="confirmar_senha" name="confirmar_senha"
                           type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn btn-primary btn-lg w-100" type="submit">Criar conta</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}">Já tenho uma conta</a>
            </div>
        </div>
    </main>
</body>
</html>
